syntax = "proto3";

package raft;

message LogEntry {
  int32 term = 1;
  bytes command = 2;
}

message RequestVote {
  int32 term = 1;
  int32 candidate_id = 2;
  int32 last_log_index = 3;
  int32 last_log_term = 4;
}

message RequestVoteResponse {
  int32 term = 1;
  int32 voter_id = 2;
  bool vote_granted = 3;
}

message AppendEntries {
  int32 term = 1;
  int32 leader_id = 2;
  int32 prev_log_index = 3;
  int32 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int32 leader_commit = 6;
}

message AppendEntriesResponse {
  int32 term = 1;
  int32 follower_id = 2;
  bool success = 3;
  int32 match_index = 4;
}

message Snapshot {
  int32 term = 1;
  int32 leader_id = 2;
  int32 last_included_index = 3;
  int32 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotResponse {
  int32 term = 1;
  int32 follower_id = 2;
}

message TreeNode {
  int32 parent = 1; // -1 means null
  bytes metadata = 2; // JSON or opaque bytes
  int32 child = 3;
}

message SnapshotPayload {
  map<int32, int32> checkpoint = 1; // replica_id -> checkpoint value
  int32 log_offset = 2;
  repeated TreeNode tree = 3;
}

service RaftService {
  rpc RequestVoteRpc(RequestVote) returns (RequestVoteResponse);
  rpc AppendEntriesRpc(AppendEntries) returns (AppendEntriesResponse);
  rpc InstallSnapshotRpc(Snapshot) returns (InstallSnapshotResponse);
}
